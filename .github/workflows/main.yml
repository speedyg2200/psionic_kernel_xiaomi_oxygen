name: Build Android Kernel

on:
  push:
    branches: [ "5.15-bpf" ]
  pull_request:
    branches: [ "5.15-bpf" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 5.15-bpf Branch
        uses: actions/checkout@v4
        with:
          ref: 5.15-bpf
          submodules: recursive

      - name: Free Up Disk Space
        run: |
          echo "Removing heavy preinstalled software to free disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex patch pkg-config git curl tar xz-utils zip unzip \
            cpio rsync kmod perl python3 python-is-python3 libssl-dev libelf-dev pahole \
            libncurses-dev zlib1g-dev libyaml-dev lz4 zstd device-tree-compiler adb fastboot

      - name: Prepare Output Directory
        run: |
          mkdir -p ~/build-oxygen

      - name: Clone Android Kernel Tools
        run: |
          mkdir -p ~/toolchains
          git clone https://github.com/prabhatkrmishra/android-kernel-tools.git ~/toolchains/android-kernel-tools

      - name: Build Kernel
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: |
            **/Image.gz-dtb
            /home/runner/build-oxygen/arch/arm64/Image.gz-dtb
          if-no-files-found: error
